[package]
name = "deskdrop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Copy/paste text, images and files between macOS and Windows; a companion to Deskflow"
license = "MIT"
repository = "https://github.com/dunstorm/deskdrop"
readme = "README.md"
keywords = ["clipboard", "deskflow", "file-transfer", "macos", "windows"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", "examples/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.9"
sha2 = "0.10"
getrandom = "0.2"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
strip = true

[features]
# Headless test peer (`deskdrop devpeer`), for testing without a second OS.
devpeer = []
